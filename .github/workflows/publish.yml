name: Build and publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    # Never publish a release whose tests fail (the downloads are tested in the regular CI)
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dl]" pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: pytest -m "not network"

  build-and-publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Needed for PyPI publishing
      id-token: write
      # Needed for GitHub releases
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Make release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          make_latest: true
