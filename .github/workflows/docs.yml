name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install -e .[docs]
      - name: Build docs
        run: |
          cd docs
          make html
          cd ..
      - name: Check size of the built docs
        # GitHub rejects files over 100 MB; a huge page means an example printed too much
        run: |
          large=$(find docs/_build/html -type f -size +20M)
          if [ -n "$large" ]; then
            echo "::error::Built docs contain files over 20 MB:"
            ls -lh $large
            exit 1
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
