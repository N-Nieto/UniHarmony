[tox]
requires =
    tox>=4
env_list =
    ruff,
    changelog,
    coverage,
    py3{11,12,13,14,15}
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: coverage
    3.15: py315

[testenv]
skip_install = false
# Install the deep learning extra with the CPU build of PyTorch (smaller than the CUDA build),
# and DataLad for the dataset downloads (git-annex must be installed on the system)
extras =
    dl
    datasets
setenv =
    PIP_EXTRA_INDEX_URL = https://download.pytorch.org/whl/cpu
deps =
    pytest
# Offline: tox -- -m "not network"
commands =
    pytest {posargs}

[testenv:ruff]
description = run ruff
skip_install = true
deps =
    ruff
commands =
    ruff format --check {toxinidir}/src {toxinidir}/tests
    ruff check {toxinidir}/src {toxinidir}/tests

[testenv:changelog]
description = show changelog
skip_install = false
deps =
    towncrier
commands =
    towncrier build --draft

[testenv:coverage]
description = run tests with coverage
skip_install = false
extras =
    dl
    datasets
setenv =
    PIP_EXTRA_INDEX_URL = https://download.pytorch.org/whl/cpu
deps =
    pytest-cov
commands =
    pytest --cov=uniharmony --cov-report=xml --cov-report=term --cov-config=pyproject.toml {posargs}
